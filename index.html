<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AniBlue — Tytuł</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="logo">
        <a href="#" class="logo-link"><span class="logo-mark">Ani</span><span class="logo-name">Blue</span></a>
      </div>

      <div class="search">
        <input id="searchInput" type="search" placeholder="Szukaj anime, tytułów..." />
        <button id="searchBtn" class="btn btn-ghost">Szukaj</button>
      </div>
    </div>
  </header>

  <main>
    <!-- HERO (zamień istniejący .hero-inner) -->
<section class="hero">
  <div class="hero-inner container">
    <div class="hero-media">
      <img id="heroImage" src="../meta-data/images/obrazek.jpg" alt="Okładka" />
      <!-- overlay z przyciskami strzałek i licznikiem -->
      <div class="hero-overlay">
        <button id="prevBtn" class="overlay-arrow" aria-label="Poprzedni">&lt;</button>
        <div class="overlay-counter"><span id="carouselIndex">0</span>/<span id="carouselTotal">0</span></div>
        <button id="nextBtn" class="overlay-arrow" aria-label="Następny">&gt;</button>
      </div>
    </div>

    <div class="hero-content">
      <h1 id="title">Tytuł ładowany z JSON...</h1>

      <div class="meta-top">
        <span id="episodesInfo" class="episodes">Odcinki: —</span>
        <span id="typeInfo" class="ep-type">Typ: —</span>
        <span id="genresInfo" class="genres">Gatunki: —</span>
      </div>

      <p id="description" class="desc">Opis ładowany z JSON...</p>

      <!-- reszta hero-content bez zmian -->
    </div>
  </div>
</section>

    <section class="list container">
      <h2>Podobne tytuły</h2>

      <div class="carousel-wrap">
        <button id="prevBtn" class="carousel-arrow">&lt;</button>
        <div id="carousel" class="cards-grid carousel" aria-live="polite"></div>
        <button id="nextBtn" class="carousel-arrow">&gt;</button>
        <div class="carousel-counter"><span id="carouselIndex">0</span>/<span id="carouselTotal">0</span></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <small>© <strong>AniBlue</strong> — wszystkie prawa zastrzeżone</small>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
